name: Form3
kind: company
description: Form3 is a United Kingdom-headquartered, cloud-native payments technology
  company offering account-to-account payment processing as a single, unified REST
  API to banks and fintechs. Founded in 2016 and headquartered in London, Form3 runs
  a fully managed, Payments-as-a-Service platform that connects customers to domestic
  and cross-border schemes - UK Faster Payments, Bacs and CHAPS, SEPA Credit Transfer,
  SEPA Instant and SEPA Direct Debit, and US instant rails - alongside Confirmation
  of Payee / Verification of Payee name-checking, direct debit mandate management,
  scheme-addressable account identification, event notifications (webhooks), and full
  audit trails. Its public API is REST built on the json:api specification, documented
  at api-docs.form3.tech with a downloadable Swagger 2.0 definition, and authenticated
  with OAuth2 client-credentials plus HTTP Message Signatures request signing and,
  in some environments, mutual TLS. Form3 is API-native and developer-facing but is
  a regulated B2B rail rather than an open self-serve signup product; production access
  is contracted.
