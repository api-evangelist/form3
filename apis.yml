  description: The unified Form3 Public API - a single REST API built on the json:api
    specification that connects banks and fintechs to domestic and cross-border payment
    schemes, covering payments, direct debits, mandates, accounts, files, notifications,
    security and audit. Swagger 2.0, 163 documented paths, host api.form3.tech, basePath
    /v1, OAuth2 client-credentials with HTTP Message Signatures request signing.
