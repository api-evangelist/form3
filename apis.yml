- aid: form3:form3-payments-api
  name: Form3 Payments API
  description: Send and receive account-to-account payments across supported schemes
    - UK Faster Payments, Bacs and CHAPS, SEPA Credit Transfer, SEPA Instant, and US
    instant rails - and handle payment exceptions such as rejections, returns, reversals
    and recalls. Represented by the PaymentReads and PaymentWrites operations under
    /transaction/payments in the Form3 Public API.
