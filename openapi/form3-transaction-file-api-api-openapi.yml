          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        409:
          description: Transaction File Submission Conflict
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TransactionFileSubmissionConflictError'
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionFileSubmissionConflictError'
        500:
