      responses:
        200:
          description: Transaction File Submission Task Updated
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TransactionFileSubmissionTaskResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionFileSubmissionTaskResponse'
        400:
